name: ingest

# Downloads the official nightly bulk file, builds a snapshot, and publishes it to GitHub Pages.
# - Pull requests: tests plus a full dry run (nothing is published).
# - Schedule / manual on main: publish. Fails closed: if any check fails, nothing is published
#   and an issue is opened.
# - Manual with `rollback_to`: republish an earlier snapshot without rebuilding. Snapshots newer
#   than the target are revoked (moved to `revoked/` on the state branch) and never republished.
# State lives on the `snapshots` branch: `manifests/<id>.json`, `latest.json`, `heartbeat.json`,
# `revoked/<id>.json`, `skip-etag`. It is written only AFTER a successful Pages deploy, so a
# failed deploy is retried by the next run. Snapshot files are archived as release assets and
# are never committed.
#
# Security: values that come from outside (HTTP headers, workflow inputs) reach shell scripts
# only through `env:` and are validated before use. The token is given only to the steps that
# call gh or push; `npm ci` and the build never see it.

on:
  schedule:
    - cron: "10 7 * * *"
    - cron: "10 13 * * *"
  workflow_dispatch:
    inputs:
      rollback_to:
        description: "Snapshot id to republish as latest (leave empty for a normal run)"
        required: false
        default: ""
      force:
        description: "Rebuild even if the source file is unchanged"
        type: boolean
        default: false
  pull_request:
    paths-ignore: ["districts/**", "docs/**", "**.md"]

permissions:
  contents: read

concurrency:
  group: ingest-${{ github.event_name == 'pull_request' && github.ref || 'publish' }}
  cancel-in-progress: false

env:
  SOURCE_BASE: https://downloads.leginfo.legislature.ca.gov
  SESSION: "20252026"
  KEEP_PUBLISHED: "7" # snapshots kept on the site (latest + 6)
  KEEP_RELEASES: "30"
  MIN_APP_VERSION: "0.1.0"
  STATE_URL: https://github.com/${{ github.repository }}.git

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: test
    if: ${{ github.event_name == 'pull_request' || inputs.rollback_to == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # release asset + heartbeat (not used on pull requests)
      issues: write
    outputs:
      published: ${{ steps.result.outputs.published }}
      snapshot: ${{ steps.ingest.outputs.snapshot }}
    env:
      DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
      FORCE: ${{ inputs.force && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Load state (snapshots branch)
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads "$STATE_URL" snapshots >/dev/null 2>&1; then
            git clone -q --depth 1 --branch snapshots "$STATE_URL" state
            n=$(ls -1 state/manifests 2>/dev/null | wc -l)
            [ "$n" -ge 1 ] || { echo "State branch exists but holds no manifests; refusing to continue."; exit 1; }
            echo "manifests: $n"
          else
            mkdir -p state/manifests
            echo "No state branch yet (first run)."
          fi

      - name: Pick the newest nightly file
        id: pick
        run: |
          set -uo pipefail
          best=""; best_ts=0; best_lm=""; best_et=""
          for d in Mon Tue Wed Thu Fri Sat Sun; do
            f="pubinfo_daily_${d}.zip"
            h=$(curl -sS -I -m 60 --retry 3 "$SOURCE_BASE/$f" | tr -d '\r') || continue
            printf '%s\n' "$h" | grep -qi '^HTTP/.* 200' || continue
            lm=$(printf '%s\n' "$h" | grep -i '^last-modified:' | head -n1 | cut -d' ' -f2-)
            et=$(printf '%s\n' "$h" | grep -i '^etag:' | head -n1 | cut -d' ' -f2- | tr -d '"')
            ts=$(date -u -d "$lm" +%s 2>/dev/null) || continue
            # An ETag is only ever compared and stored; anything unusual is dropped, not trusted.
            printf '%s' "$et" | grep -Eq '^[A-Za-z0-9:._/+=-]{1,128}$' || et=""
            echo "$f  ts=$ts  etag=$et"
            if [ "$ts" -gt "$best_ts" ]; then best_ts=$ts; best=$f; best_lm=$lm; best_et=$et; fi
          done
          [ -n "$best" ] || { echo "No nightly file reachable"; exit 1; }
          iso=$(date -u -d "$best_lm" +%Y-%m-%dT%H:%M:%SZ)
          # With no usable ETag, the Last-Modified time is the change key.
          key="${best_et:-lm-$iso}"
          {
            echo "file=$best"
            echo "date=$iso"
            echo "etag=$best_et"
          } >> "$GITHUB_OUTPUT"
          last=""
          if [ -f state/latest.json ]; then
            last=$(node -e "const m=require('./state/latest.json');const s=m.sources.find(s=>s.session===process.env.SESSION)||{};console.log(s.etag||('lm-'+s.sourceFileDate))")
          fi
          skip=""
          [ -f state/skip-etag ] && skip=$(head -c 200 state/skip-etag | tr -d '\n')
          changed=1
          if [ "$DRY_RUN" = "0" ] && [ "$FORCE" != "1" ]; then
            if [ -n "$last" ] && [ "$last" = "$key" ]; then echo "Source unchanged."; changed=0; fi
            if [ -n "$skip" ] && [ "$skip" = "$key" ]; then echo "Source is the one that was rolled back; waiting for a new file (or run with force)."; changed=0; fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Download
        if: steps.pick.outputs.changed == '1'
        env:
          SRC_FILE: ${{ steps.pick.outputs.file }}
        run: |
          set -euo pipefail
          case "$SRC_FILE" in pubinfo_daily_Mon.zip|pubinfo_daily_Tue.zip|pubinfo_daily_Wed.zip|pubinfo_daily_Thu.zip|pubinfo_daily_Fri.zip|pubinfo_daily_Sat.zip|pubinfo_daily_Sun.zip) ;; *) echo "Unexpected file name"; exit 1;; esac
          curl -sS -f -m 2400 --retry 3 --retry-delay 30 -o source.zip \
            -w 'http=%{http_code} bytes=%{size_download} secs=%{time_total}\n' \
            "$SOURCE_BASE/$SRC_FILE"
          unzip -tq source.zip >/dev/null || { echo "Downloaded zip is corrupt"; exit 1; }

      - name: Build snapshot (fails closed)
        id: ingest
        if: steps.pick.outputs.changed == '1'
        env:
          SRC_FILE: ${{ steps.pick.outputs.file }}
          SRC_DATE: ${{ steps.pick.outputs.date }}
          SRC_ETAG: ${{ steps.pick.outputs.etag }}
        run: |
          set -euo pipefail
          prev=$(ls -1 state/manifests 2>/dev/null | sed 's/\.json$//' | sort -r | head -n $((KEEP_PUBLISHED - 1)) | paste -sd, -)
          args=(--source source.zip --session "$SESSION" --source-file "$SRC_FILE" --source-date "$SRC_DATE"
            --min-app-version "$MIN_APP_VERSION" --manifests state/manifests --previous "$prev"
            --out out/snapshot --report out/report.json)
          if [ -n "$SRC_ETAG" ]; then args+=(--etag "$SRC_ETAG"); fi
          npm run ingest -- "${args[@]}"
          id=$(node -e "console.log(require('./out/snapshot/latest.json').snapshotId)")
          printf '%s' "$id" | grep -Eq '^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$' || { echo "Unexpected snapshot id"; exit 1; }
          echo "snapshot=$id" >> "$GITHUB_OUTPUT"
          node -e "const r=require('./out/report.json');console.log(JSON.stringify({snapshot:r.snapshotId,seconds:r.wallSeconds,rssMb:r.peakRssMb,counts:r.stats.counts,kinds:r.stats.emittedByKind,final:r.stats.finalRollCalls},null,1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the dry-run output for inspection
        if: env.DRY_RUN == '1' && steps.pick.outputs.changed == '1'
        uses: actions/upload-artifact@v7
        with:
          name: dry-run-snapshot
          path: |
            out/snapshot/latest.json
            out/report.json
          retention-days: 5

      - name: Archive as a release asset
        if: env.DRY_RUN == '0' && steps.pick.outputs.changed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SNAP: ${{ steps.ingest.outputs.snapshot }}
          SRC_FILE: ${{ steps.pick.outputs.file }}
          SRC_DATE: ${{ steps.pick.outputs.date }}
        run: |
          set -euo pipefail
          tar -C out/snapshot -czf "snapshot-$SNAP.tar.gz" .
          # A release can already exist when an earlier run built this snapshot but its deploy failed.
          if gh release view "snap-$SNAP" >/dev/null 2>&1; then
            gh release upload "snap-$SNAP" "snapshot-$SNAP.tar.gz" --clobber
          else
            gh release create "snap-$SNAP" "snapshot-$SNAP.tar.gz" --title "Snapshot $SNAP" \
              --notes "Built from $SRC_FILE ($SRC_DATE)." --latest=false
          fi

      - name: Weekly heartbeat when nothing changed
        if: env.DRY_RUN == '0' && steps.pick.outputs.changed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Keeps the scheduled workflow from being disabled for repository inactivity.
          [ -d state/.git ] || { echo "No state branch; nothing to do."; exit 0; }
          last=$(node -e "try{console.log(require('./state/heartbeat.json').at)}catch{console.log('1970-01-01')}")
          age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
          [ "$age" -ge 7 ] || { echo "No change; heartbeat is $age days old."; exit 0; }
          echo "{\"at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > state/heartbeat.json
          cd state
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Heartbeat"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:snapshots

      - id: result
        run: echo "published=${{ env.DRY_RUN == '0' && steps.pick.outputs.changed == '1' && '1' || '0' }}" >> "$GITHUB_OUTPUT"

      - name: Open an issue on failure
        if: failure() && env.DRY_RUN == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Ingest failed $(date -u +%Y-%m-%d)" \
            --body "The scheduled ingest failed and nothing was published. The site keeps serving the previous snapshot. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

  publish:
    needs: build
    # Runs after a successful build that produced a new snapshot, or directly for a rollback.
    if: ${{ always() && github.event_name != 'pull_request' && (needs.build.outputs.published == '1' || (github.event_name == 'workflow_dispatch' && inputs.rollback_to != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # state branch, written after the deploy; release pruning
      issues: write
      pages: write
      id-token: write
      actions: read # to see that the Pages artifact is listed before deploying
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy_retry.outputs.page_url }}
    env:
      GH_REPO: ${{ github.repository }}
      ROLLBACK_TO: ${{ inputs.rollback_to }}
      BUILT: ${{ needs.build.outputs.snapshot }}
    steps:
      - name: Load state and choose the target
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          idre='^[0-9]{8}T[0-9]{6}Z-[0-9a-f]{8}$'
          if git ls-remote --exit-code --heads "$STATE_URL" snapshots >/dev/null 2>&1; then
            git clone -q --depth 1 --branch snapshots "$STATE_URL" state
            [ "$(ls -1 state/manifests 2>/dev/null | wc -l)" -ge 1 ] || { echo "State branch holds no manifests"; exit 1; }
          else
            mkdir -p state/manifests && git -C state init -q -b snapshots
          fi
          cd state
          if [ -n "$ROLLBACK_TO" ]; then
            target="$ROLLBACK_TO"
            printf '%s' "$target" | grep -Eq "$idre" || { echo "rollback_to is not a snapshot id"; exit 1; }
            [ -f "manifests/$target.json" ] || { echo "Unknown snapshot $target"; exit 1; }
            # Everything newer than the target is revoked: off the site, out of `previous`,
            # and out of the count-drop comparison for later builds.
            mkdir -p revoked
            newest=""
            for id in $(ls -1 manifests | sed 's/\.json$//' | sort -r); do
              if [[ "$id" > "$target" ]]; then
                [ -n "$newest" ] || newest="$id"
                mv "manifests/$id.json" "revoked/$id.json"; echo "revoked $id"
              fi
            done
            if [ -n "$newest" ]; then
              # Do not rebuild from the same source file that produced the revoked snapshot.
              SESSION="$SESSION" node -e "const m=require('./revoked/'+process.argv[1]+'.json');const s=m.sources.find(s=>s.session===process.env.SESSION)||{};process.stdout.write(s.etag||('lm-'+s.sourceFileDate))" "$newest" > skip-etag
            fi
            msg="Rollback to $target"
          else
            target="$BUILT"
            printf '%s' "$target" | grep -Eq "$idre" || { echo "No built snapshot id"; exit 1; }
            gh release download "snap-$target" --pattern "snapshot-$target.tar.gz" --dir ../dl
            mkdir -p "../x/$target" && tar -C "../x/$target" -xzf "../dl/snapshot-$target.tar.gz"
            cp "../x/$target/manifests/$target.json" manifests/
            rm -f skip-etag
            msg="Snapshot $target"
          fi
          echo "id=$target" >> "$GITHUB_OUTPUT"
          echo "msg=$msg" >> "$GITHUB_OUTPUT"

      - name: Assemble the site from release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ steps.target.outputs.id }}
        run: |
          set -euo pipefail
          mkdir -p site/v1/manifests dl x
          # The target plus the newest older ones, up to KEEP_PUBLISHED in total.
          ids=$( (echo "$TARGET"; ls -1 state/manifests | sed 's/\.json$//' | sort -r | awk -v t="$TARGET" '$0 < t') | head -n "$KEEP_PUBLISHED" )
          kept=""
          for id in $ids; do
            if [ -d "x/$id" ] || gh release download "snap-$id" --pattern "snapshot-$id.tar.gz" --dir dl 2>/dev/null; then
              [ -d "x/$id" ] || { mkdir -p "x/$id" && tar -C "x/$id" -xzf "dl/snapshot-$id.tar.gz"; }
              # Content-hashed files are shared between snapshots; copy without overwriting.
              (cd "x/$id" && find . -type f ! -name latest.json ! -path './manifests/*' -exec cp -n --parents {} "$GITHUB_WORKSPACE/site/v1/" \;)
              cp "state/manifests/$id.json" site/v1/manifests/
              kept="$kept $id"
            else
              echo "Release for $id is gone; leaving it out."
            fi
          done
          echo "$kept" | grep -qw "$TARGET" || { echo "Target snapshot archive missing"; exit 1; }
          # latest.json = the target manifest, with `previous` rewritten to the older ids actually on the site.
          node -e "
            const fs=require('fs');const [t,...rest]=process.argv.slice(1);
            const m=JSON.parse(fs.readFileSync('state/manifests/'+t+'.json','utf8'));
            m.previous=rest.filter(x=>x<t);
            fs.writeFileSync('site/v1/latest.json',JSON.stringify(m));
            fs.writeFileSync('state/latest.json',JSON.stringify(m));
          " $TARGET $kept
          cat > site/index.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>ca-leg-data</title>
          <p>Public-domain California Legislature data snapshots (Gov. Code §10248.5).
          Start at <a href="v1/latest.json">v1/latest.json</a>.
          Source and issues: <a href="https://github.com/inarun/ca-leg-data">github.com/inarun/ca-leg-data</a>.</p>
          HTML
          touch site/.nojekyll
          du -sh site; ls site/v1 | wc -l

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      # The deploy step looks the artifact up through the API, and the listing can lag behind the
      # upload ("Found 0 artifact(s)"; seen on two runs out of two on 2026-11-24). Wait until this
      # run's artifact is listed, then deploy, and try the deploy once more if it fails.
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" --jq '[.artifacts[] | select(.name == "github-pages")] | length' 2>/dev/null || echo 0)
            if [ "$n" -ge 1 ]; then echo "listed after $i checks"; exit 0; fi
            sleep 5
          done
          echo "The artifact was not listed after 3 minutes; trying the deploy anyway."
      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Pause before a second deploy attempt
        if: steps.deploy.outcome == 'failure'
        run: sleep 60
      - id: deploy_retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5

      - name: Record state (only after a successful deploy)
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ steps.target.outputs.msg }}
        run: |
          set -euo pipefail
          cd state
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -q -m "$MSG"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:snapshots

      - name: Prune old releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --limit 200 --json tagName,createdAt --jq 'sort_by(.createdAt) | reverse | .[].tagName' \
            | grep '^snap-' | tail -n +$((KEEP_RELEASES + 1)) | while read -r t; do gh release delete "$t" --yes --cleanup-tag; done

      - name: Open an issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Publish failed $(date -u +%Y-%m-%d)" \
            --body "Publishing failed. The site keeps serving the previous snapshot and the next scheduled run will try again. Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
